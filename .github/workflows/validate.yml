name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          # Build validation only; CI never calls this placeholder deployment.
          VITE_APPS_SCRIPT_URL: https://script.google.com/macros/s/ci-placeholder/exec
